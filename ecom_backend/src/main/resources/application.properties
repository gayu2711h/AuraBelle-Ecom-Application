spring.application.name=ecom-backend

#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Pranjali@2023
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#default server port 8080
server.port=9090

# All endpoints are served under /api (e.g. /api/categories, /api/auth/login)
server.servlet.context-path=/api

#JWT config - secret must be a Base64-encoded string, 256+ bits for HS256
app.jwt.secret=YXVyYWJlbGxlU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2hGb3JIUzI1Ng==
app.jwt.expiration-ms=3600000

#CORS - comma separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

#Razorpay (payment gateway) - set your own test/live keys via env vars, do NOT commit real secrets
razorpay.key-id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
razorpay.currency=INR

#AWS S3 (product images) - credentials are resolved via the default AWS credential chain
#(env vars AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, or an IAM role) - never hardcode keys here

aws.access-key-id=${AWS_ACCESS_KEY}
aws.secret-access-key=${AWS_SECRET_KEY}

aws.s3.bucket-name=${AWS_S3_BUCKET:aura-belle-media}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.product-image-folder=products/

#File upload limits (product image uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB