spring.application.name=ecom-backend

#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#default server port 8080
server.port=9090

# All endpoints are served under /api (e.g. /api/categories, /api/auth/login)
server.servlet.context-path=/api

#JWT config - secret must be a Base64-encoded string, 256+ bits for HS256
app.jwt.secret=YXVyYWJlbGxlU2VjcmV0S2V5Rm9ySldUU2lnbmluZ011c3RCZUxvbmdFbm91Z2hGb3JIUzI1Ng==
app.jwt.expiration-ms=3600000
